services:
  postgres:
    image: postgres:16-alpine
    container_name: avlab-postgres
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: avlab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d avlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
